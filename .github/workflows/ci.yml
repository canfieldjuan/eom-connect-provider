name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        # The host-integration test importorskips connect_automate, which is a
        # dev-only dependency not installed here; the provider's own protocol and
        # credential tests run in full.
        run: pytest -q
